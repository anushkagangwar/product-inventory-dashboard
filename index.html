
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Product Inventory Dashboard</h1>
        <p>Manage products and track inventory value</p>
    </header>

    <main>
        <section class="card">
            <h2>Add New Product</h2>

            <form id="productForm">
                <label for="productName">Product Name</label>
                <input
                    type="text"
                    id="productName"
                    placeholder="Enter product name"
                    required
                >

                <label for="productPrice">Product Price ($)</label>
                <input
                    type="number"
                    id="productPrice"
                    placeholder="Enter product price"
                    min="0.01"
                    step="0.01"
                    required
                >

                <button type="submit">Add Product</button>
                <p id="message" role="status"></p>
            </form>
        </section>

        <section class="stats">
            <div class="card">
                <h3>Total Products</h3>
                <p id="totalProducts">0</p>
            </div>

            <div class="card">
                <h3>Total Inventory Value</h3>
                <p id="totalValue">$0.00</p>
            </div>
        </section>

        <section class="card">
            <h2>Product Inventory</h2>
            <div id="productList"></div>
        </section>

        <section class="card">
            <h2>Affordable Products (Under $200)</h2>
            <div id="affordableProducts"></div>
        </section>

        <section class="card">
            <h2>Formatted Report</h2>
            <ul id="reportList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
